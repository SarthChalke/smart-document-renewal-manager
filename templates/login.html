{% extends "base.html" %}

{% block title %}Sign In — Smart Document & Financial Manager{% endblock %}

{% block auth_content %}
<div class="card border-0 shadow-lg" style="border-radius: 16px;">
    <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle mb-3" style="background-color: #ECE8FF;">
                <i class="bi bi-shield-lock-fill fs-1" style="color: #6C3BFF;"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: #6C3BFF;">Smart DocManager</h3>
            <p class="text-muted small">Document, Loan, EMI & Financial Management</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label small fw-bold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-purple w-100 py-2 fw-bold shadow-sm" style="border-radius: 8px;">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{{ url_for('register') }}" class="small fw-bold ms-1 text-decoration-none" style="color: #6C3BFF;">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
