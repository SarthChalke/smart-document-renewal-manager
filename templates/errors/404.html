{% extends "base.html" %}

{% block title %}Page Not Found (404) — Smart Document & Financial Manager{% endblock %}

{% block content %}

        <i class="bi bi-question-circle text-warning fs-1"></i>
    </div>
    <h2 class="fw-bold mb-2">404 — Page Not Found</h2>

        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
