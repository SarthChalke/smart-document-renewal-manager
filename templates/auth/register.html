{% extends "base_modern.html" %}

{% block title %}Register | Smart Document Manager{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 460px;
    }
    .auth-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        padding: 40px;
    }
    .auth-header {
        text-align: center;
        margin-bottom: 32px;
    }
    .auth-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #6C3BFF 0%, #8a5cf5 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
    }
    .form-label {
        font-weight: 500;
        color: #495057;
        margin-bottom: 8px;
    }
    .form-control {
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid #ced4da;
        transition: border-color 0.3s ease;
    }
    .form-control:focus {
        border-color: #6C3BFF;
        box-shadow: 0 0 0 0.25rem rgba(108, 59, 191, 0.25);
    }
    .btn-primary-glow {
        background: linear-gradient(90deg, #6C3BFF 0%, #8a5cf5 100%);
        border: none;
        padding: 10px 24px;
        font-weight: 600;
        border-radius: 12px;
        transition: opacity 0.3s ease;
    }
    .btn-primary-glow:hover {
        opacity: 0.9;
    }
</style>
{% endblock %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-card animate__animated animate__fadeInUp">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="mb-1">Create Account</h3>
            <p class="text-muted mb-0">Join our community to manage your documents</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="phone">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control" id="phone" name="phone">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    <small class="text-muted">Min 6 characters</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-glow w-100">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                Already have an account? <strong class="text-primary">Sign in</strong>
            </a>
        </div>
    </div>
</div>
{% endblock %}
