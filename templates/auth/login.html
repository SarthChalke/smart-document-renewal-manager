{% extends "base_modern.html" %}

{% block title %}Login | Smart Document Manager{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 420px;
    }
    .auth-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        padding: 40px;
        transform: preserve-3d;
    }
    .auth-header {
        text-align: center;
        margin-bottom: 32px;
    }
    .auth-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #6C3BFF 0%, #8a5cf5 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
    }
    .form-label {
        font-weight: 500;
        color: #495057;
        margin-bottom: 8px;
    }
    .form-control {
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid #ced4da;
        transition: border-color 0.3s ease;
    }
    .form-control:focus {
        border-color: #6C3BFF;
        box-shadow: 0 0 0 0.25rem rgba(108, 59, 191, 0.25);
    }
    .btn-primary-glow {
        background: linear-gradient(90deg, #6C3BFF 0%, #8a5cf5 100%);
        border: none;
        padding: 10px 24px;
        font-weight: 600;
        border-radius: 12px;
        transition: opacity 0.3s ease;
    }
    .btn-primary-glow:hover {
        opacity: 0.9;
    }
    .divider {
        display: flex;
        align-items: center;
        margin: 24px 0;
        color: #adb5bd;
    }
    .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e9ecef;
    }
    .divider::after {
        margin-left: 12px;
    }
    .social-login a {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        margin: 0 8px;
        transition: transform 0.3s ease;
    }
    .social-login a:hover {
        transform: translateY(-2px);
    }
    .form-footer {
        text-align: center;
        margin-top: 24px;
        color: #6c757d;
        font-size: 14px;
    }
</style>
{% endblock %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-card animate__animated animate__fadeInUp">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="mb-1">Welcome Back</h3>
            <p class="text-muted mb-0">Enter your credentials to access your account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-4">
                <label class="form-label" for="username">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="#" class="text-decoration-none">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary-glow w-100">
                <i class="bi bi-arrow-right me-2"></i>Sign In
            </button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social-login d-flex justify-content-center mb-3">
            <a href="#" class="btn btn-outline-dark border-1">
                <i class="bi bi-google"></i>
            </a>
            <a href="#" class="btn btn-outline-dark border-1">
                <i class="bi bi-facebook-f"></i>
            </a>
            <a href="#" class="btn btn-outline-dark border-1">
                <i class="bi bi-apple"></i>
            </a>
        </div>

        <div class="form-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-medium">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
